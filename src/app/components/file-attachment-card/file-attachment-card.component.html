<div class="card my-3" style="max-width: 540px;">
    <div class="row g-0">
        <div class="col-md-4">
            <!-- <img src="..." class="img-fluid rounded-start" alt="..."> -->
            <app-file-preview [fileId]="file?.uuid||''" [fileName]="fileNameWithExt" [mimeType]="file?.contentType||''">
            </app-file-preview>
        </div>
        <div class="col-md-8">
            <div class="card-body">
                <div class="text-end">
                    <div>
                        <button title="Download this file" class="btn btn-outline-primary btn-sm me-2"
                            (click)="downloadFile()"><i class="bi bi-download"></i></button>
                        <button title="Delete this file" class="btn btn-outline-danger btn-sm" (click)="deleteFile()" ><i
                                class="bi bi-trash3"></i></button>
                    </div>
                </div>
                <p class="card-text" [title]="fileNameWithExt">{{fileNameWithExt}}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-body-secondary">Size: {{file?.size | fileSize}}</small>
                    <span class="badge rounded-pill text-bg-primary">{{previewType | titlecase}} file</span>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <small class="text-body-secondary">Updated on {{file?.updatedAt | timeElapsed}}</small>
    </div>
</div>
