<div class="me-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-bank me-2 text-primary"></i>Investments</h3>
        <div class="ms-2">
            <button class="btn btn-primary ms-2" (click)="refreshData()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh Investments
            </button>
            <button class="btn btn-primary ms-2" (click)="addInvestment()">
                <i class="bi bi-plus-lg me-1"></i>Add Investment
            </button>
            <button class="d-none btn btn-danger ms-2" (click)="askDeleteAllInvestments()">
                <i class="bi bi-trash me-1"></i>Delete All
            </button>
        </div>
    </div>

    <!-- Investments List -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Date Time</th>
                    <th>Amount</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let Investment of investments; let i = index" (click)="openDetails(Investment)">
                    <td>{{ i + 1 }}</td>
                    <td>{{ Investment.dateOfInvestment | timeElapsed:'D' }} <span class="badge text-bg-primary">{{ Investment.dateOfInvestment | timeElapsed:'T' }}</span></td>
                    <td>{{ Investment.amount | currency:'INR' }}</td>
                    <td><span>{{ Investment.description }}</span></td>
                    <td (click)="$event.stopPropagation()">
                        <button class=" btn btn-sm btn-outline-primary me-1" (click)="editInvestment(Investment)">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" (click)="askDeleteInvestment(Investment)">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-info" (click)="openDetails(Investment)">
                            <i class="bi bi-box-arrow-up-right"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<button #launchInvestmentModalButton class="btn btn-info d-none" data-bs-toggle="modal"
    data-bs-target="#investmentModal">Launch
    Investment Modal</button>
<app-investment-modal [model]="tempInvestment" (successAction)="successAction($event)"
    (errorAction)="errorAction($event)"></app-investment-modal>

<button #launchConfirmDeleteInvestmentButton class="btn btn-info d-none" data-bs-toggle="modal"
    data-bs-target="#confirmDeleteInvestmentDialog">Launch Confirm Delete Modal</button>
<app-confirm-dialog [id]="'confirmDeleteInvestmentDialog'" [title]="'Confirm Delete'" [message]="deleteMsg"
    [confirmText]="'Delete'" [cancelText]="'Cancel'" [confirmBtnClass]="'btn-danger'" (confirmed)="deleteInvestment()">
</app-confirm-dialog>

<button #launchConfirmDeleteAllInvestmentsButton class="btn btn-info d-none" data-bs-toggle="modal"
    data-bs-target="#confirmDeleteAllInvestmentsDialog">Launch Confirm Delete All Modal</button>
<app-confirm-dialog [id]="'confirmDeleteAllInvestmentsDialog'" [title]="'Confirm Delete All'" [message]="deleteMsg"
    [confirmText]="'Delete'" [cancelText]="'Cancel'" [confirmBtnClass]="'btn-danger'"
    (confirmed)="deleteAllInvestments()">
</app-confirm-dialog>

<app-toast *ngIf="showToast" [type]='toastType' [message]='toastMsg' (closeAction)="hideToastComponent()"></app-toast>
